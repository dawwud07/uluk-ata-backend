name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run flake8
        run: |
          python -m flake8 apps config api

      - name: Run black (check)
        run: |
          python -m black --check apps config api

      - name: Run isort (check)
        run: |
          python -m isort --check-only apps config api

      - name: Run Django system checks
        run: |
          python manage.py check

      - name: Run tests
        run: |
          python manage.py test
